name: ai-sdlc-autopilot governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# repo 預設 GITHUB_TOKEN 為唯讀；自動合併（gh pr merge --auto）需要以下寫入權限。
permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # G3w Windows 建置閘門（CHG-20260803-08）
  #
  # 為什麼需要它：相位 2 起，W1-01 / W1-02 / H1-01 / H1-02 的 CMakeLists 皆以 if(WIN32)
  # 包住——ubuntu 的 G3 **完全看不到它們**。在本閘門上線之前，main 上約 1200 行 win32
  # 程式碼的正確性只有開發機的手動證據，任何人改壞都不會紅（CHG-20260803-04/-05/-06 皆已明載）。
  #
  # gate job 以 needs 相依於本 job：Windows 建置紅燈 → gate 被跳過 → 自動合併的指令
  # 根本不會執行（fail-closed）。代價是兩個 job 序列化，PR 多等約十餘分鐘。
  # ---------------------------------------------------------------------------
  gate_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC 全建 + ctest
        shell: bash
        run: |
          # **不要釘死產生器版本。** 初版寫 -G "Visual Studio 17 2022"，在 windows-latest 上
          # 直接 "could not find any instance of Visual Studio"——runner 映像的 VS 版本會隨時間更新，
          # 釘死版本等於把閘門綁在某一版映像上。省略 -G 讓 CMake 挑該機器上實際存在的 VS；
          # -A x64 仍要指定（不給的話 VS 產生器的預設平台不保證是 x64）。
          cmake -S . -B build -A x64
          # 把實際選到的產生器印出來：日後 runner 換版時，這行是第一個線索。
          grep -E '^CMAKE_GENERATOR(_PLATFORM)?:' build/CMakeCache.txt
          cmake --build build --config Debug --parallel 4
          # 真空綠燈防線（同 ubuntu G3）：沒有任何註冊測試 = 紅燈
          N=$(ctest --test-dir build -C Debug -N 2>/dev/null | sed -n 's/.*Total Tests: //p')
          [ "${N:-0}" -gt 0 ] || { echo "::error::repo 沒有任何 CTest 測試，綠燈無意義"; exit 1; }
          ctest --test-dir build -C Debug --output-on-failure

      # 第二道真空綠燈防線，專防本閘門自己失效：
      # 若 if(WIN32) 的條件納入被改壞（GLOB 深度不對、target 名改了、守衛寫錯），
      # Windows 專屬單元會被靜默排除，而上一步仍會拿 176 個平台中立測試印出綠燈——
      # 那正是「看起來有守、其實沒守」的假綠燈。逐一點名確認它們真的在測試清單裡。
      - name: 確認 Windows 專屬單元真的有被建進來
        shell: bash
        run: |
          LIST=$(ctest --test-dir build -C Debug -N)
          for t in backend_win32 tray_win32 h1_01_paint h1_02_controls; do
            echo "$LIST" | grep -q "$t" \
              || { echo "::error::Windows 專屬測試 $t 不在測試清單中——if(WIN32) 條件納入可能壞了"; exit 1; }
          done
          echo "Windows 專屬單元均已納入建置"

  gate:
    # 守住 Windows 建置：紅燈時本 job 直接被跳過，合併指令不會執行。
    needs: gate_windows
    runs-on: ubuntu-latest  # 本 job 的 G3 在 ubuntu 建，守的是「平台中立性」；MSVC 由 gate_windows 負責
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 從分支名反查工作單元。feat/<slug> = 工作單元（跑全部 unit 專屬閘）；
      # 其餘（chore/、fix/ 等 infra/bootstrap 分支，如 root CMake、governance、全庫重構）
      # 對不到單元，設 is_unit=false：跳過 unit 專屬閘（G1 scope / G5 ACC / G6 halt），
      # 但仍跑 repo 級閘（G1b 後端 / G1c 階段 / G2 CHG / G3 建置 / G4 結構）——
      # 這樣 infra 變更（尤其動到建置結構者）也能拿到真正的 G3 建置綠燈才合併。
      - id: unit
        shell: bash
        run: |
          if [[ "$GITHUB_HEAD_REF" == feat/* ]]; then
            python scripts/plan.py unit-for-branch "$GITHUB_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "is_unit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::非 feat/ 分支（$GITHUB_HEAD_REF）：以 infra 變更處理，跳過 unit 專屬閘、仍跑 G3 建置"
            echo "is_unit=false" >> "$GITHUB_OUTPUT"
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "risk=low" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # G8 workflow 注入閘門（CHG-20260810-04）
      #
      # 擋：`run:` 區塊直接內插不可信的 ${{ }}。${{ }} 是在 shell 看到腳本之前就展開成
      # 字面文字的，所以內插 PR 內文 = 把內文貼進腳本，反引號與 $(...) 會被執行。
      # 2026-08-10 PR #210 的內文真的被當成指令跑過（K-008）。
      #
      # 放在最前面：它守的是這個 workflow 自己，若本檔已被改成可注入，
      # 後面每一道閘門的判定都不再可信——先確認裁判沒被買通，再開始比賽。
      # ---------------------------------------------------------------------
      - name: G8 workflow_lint
        run: python scripts/workflow_lint.py

      # G1 鎖定範圍（把「不得擴權」變成機器強制）——僅工作單元；infra 變更本就跨範圍，不適用。
      - name: G1 scope_check
        if: steps.unit.outputs.is_unit == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}   # git 分支名可含 $ 與反引號，不得內插進 run:
        run: python scripts/scope_check.py --unit ${{ steps.unit.outputs.id }} --base "origin/$BASE_REF"

      # G1b 相位閘門：當前相位不得出現未允許的平台後端
      - name: G1b backend_guard
        run: python scripts/backend_guard.py

      # G1c 階段閘門（NFR-08）：較早階段不得依賴較晚階段
      - name: G1c stage_check
        run: python scripts/stage_check.py

      # G2 PR 必須連結 CHG
      #
      # PR 內文**必須經 env: 傳入**，不得直接 ${{ }} 內插進 run:（CHG-20260810-04）。
      # ${{ }} 是在 shell 看到腳本之前展開成字面文字的，所以內插等於把 PR 內文貼進
      # 腳本裡——內文的反引號與 $(...) 會被當成指令執行。這在 2026-08-10 真的發生過
      # （PR #210 的內文把 markdown 行內程式碼當指令跑了，見 knowledge K-008）。
      # G8 workflow_lint 現在會擋住這種寫法復發。
      - name: G2 CHG linked
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -qE 'CHG-[0-9]{8}-' \
            || { echo "::error::PR 內文缺少 CHG- 參照"; exit 1; }

      # ---------------------------------------------------------------------
      # G7 Status 收尾閘門（CHG-20260810-03）
      #
      # 為什麼需要它：合併發生在 PR 端，而 CHG 文件在合併前就凍結在功能分支上——
      # 這條流程沒有任何一步會回頭改 Status。2026-08-10 掃出 103 筆已合併卻仍停在
      # Proposed（或根本沒有 ## Status 段）的變更。Status 是進場握手判斷「有沒有
      # 半途而廢的階段」的唯一依據，而提醒 hook 只印前 5 筆：兩者相乘，警告永遠不會
      # 歸零，於是被當成背景雜訊。CHG-20260810-01/-02 清了存量，本閘門防它再長出來。
      #
      # 為什麼是合併「前」擋下而不是合併「後」自動回寫：is_unit=false 的 infra 分支
      # 不跑 G5，對那些 PR「合併了」不等於「驗收過」。讓 CI 自動蓋 Accepted 會是一個
      # 恆為真的判定——本檔已防兩次的真空綠燈。本閘門只讀不寫，判定仍由人做。
      #
      # 位置刻意放在 G3 之前：純文字檢查，紅燈時省下十餘分鐘的建置。
      # ---------------------------------------------------------------------
      - name: G7 status_check（閘門自我測試 + CHG 收尾判定）
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 先跑閘門自己的測試。閘門壞掉與閘門放行在 exit code 上無法區分，
          # 所以在用它判定任何 PR 之前，先證明它的紅燈確實會亮。
          # discover 而非逐檔點名：新增一支閘門測試不該還要記得回來改這裡。
          python -m unittest discover -s tests/gates -p 'test_*.py' -v
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python scripts/status_check.py --base "origin/$BASE_REF" \
            --pr-body-file /tmp/pr_body.txt

      # G3 測試綠燈（無測試 = 紅燈，不是綠燈）
      - name: G3 tests（C++ / CMake + CTest）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          # -j 不帶數字 = make 無限並行；單元數破百後同時起 100+ 個 gtest 編譯會 OOM（runner 被 SIGTERM，exit 143）。
          # 明確限制並行度以壓住峰值記憶體（每個 Debug gtest TU 可達 ~1.5–2GB；-j 2 → ~4GB，留安全邊際至 176 單元）。
          cmake --build build -j 2
          # 真空綠燈防線：沒有任何註冊測試 = 紅燈（空 repo 或忘了寫測試都擋）
          N=$(ctest --test-dir build -N 2>/dev/null | sed -n 's/.*Total Tests: //p')
          [ "${N:-0}" -gt 0 ] || { echo "::error::repo 沒有任何 CTest 測試，綠燈無意義"; exit 1; }
          ctest --test-dir build --output-on-failure

      # G4 結構同步：動了 src/ 、engine/ 或 modules/ 就得動 docs/structure/
      # 三個程式碼頂層目錄都要涵蓋 —— docs/structure/directory.md 的分層對應表記錄三者的組成，
      # 任一者增減而不同步都會造成結構文件漂移。
      # 新增程式碼頂層目錄時，務必同步擴充此處，否則該批單元會靜默脫離結構同步閘門。
      - name: G4 structure sync
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          D=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$D" | grep -qE '^(src|engine|modules)/' && ! echo "$D" | grep -q '^docs/structure/' \
            && { echo "::error::改了 src/、engine/ 或 modules/ 但沒更新 docs/structure/"; exit 1; } || true

      # G5 medium 以上：ACC 存在且驗收者 ≠ 實作者（僅工作單元）
      - name: G5 ACC + identity
        if: steps.unit.outputs.is_unit == 'true' && steps.unit.outputs.risk != 'low'
        shell: bash
        run: |
          S=$(echo "${GITHUB_HEAD_REF#feat/}")
          A=$(ls docs/acceptance/ACC-*-$S.md 2>/dev/null | head -1)
          [ -z "$A" ] && { echo "::error::medium 風險需要 ACC，未找到"; exit 1; }
          grep -q 'Result: *pass' "$A" || { echo "::error::ACC 未判定 pass"; exit 1; }
          IMP=$(grep -m1 'Implemented by:' docs/changes/CHG-*-$S.md | sed 's/.*: *//')
          VER=$(grep -m1 'Verifier:' "$A" | sed 's/.*: *//')
          [ "$IMP" = "$VER" ] && { echo "::error::驗收者與實作者同一人：$IMP"; exit 1; } || true

      # G6 停點契約（僅工作單元；infra 變更無對應單元，不跑）
      - name: G6 halt gate
        id: halt
        if: steps.unit.outputs.is_unit == 'true'
        continue-on-error: true
        run: python scripts/plan.py gate ${{ steps.unit.outputs.id }} --gate before_merge_or_release

      # 用 --auto 排隊，等本 job 的 gate check 轉綠後才合併。
      # 不可用即時合併：那會在 gate check 仍 pending 時觸發，被 branch protection 擋（自我死鎖）。
      - name: 自動合併（單元 AUTO）
        if: steps.unit.outputs.is_unit == 'true' && steps.halt.outcome == 'success'
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: 標記待人工核准（HALT）
        if: steps.unit.outputs.is_unit == 'true' && steps.halt.outcome == 'failure'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label "halt:awaiting-human"
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "停點契約判定 **HALT**（risk=$RISK）。所有 CI 閘門已綠，等待人工核准後手動合併。"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RISK: ${{ steps.unit.outputs.risk }}

      # infra/bootstrap 分支：前述 repo 級閘（含 G3 建置）全綠即自動合併（無 halt 契約，屬 low 自主）。
      - name: 自動合併（infra AUTO）
        if: success() && steps.unit.outputs.is_unit == 'false'
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
